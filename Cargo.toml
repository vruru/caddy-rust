[package]
name = "caddy-compat-native"
version = "0.1.0"
edition = "2024"
rust-version = "1.99.1"
publish = false
license = "Apache-2.0"

[features]
# Development integration stays opt-in until complete compatibility acceptance.
native-run = []

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip", "unbounded_depth"] }
sha2 = { version = "0.10", features = ["oid"] }
rustls = { version = "=0.23.46", default-features = false, features = ["ring", "aws_lc_rs", "std", "tls12"] }
rustls-pemfile = "2"
x509-parser = "0.18"
zeroize = "1"
pem = "3"
rustix = { version = "1", features = ["fs", "process"] }
rcgen = { version = "=0.14.10", default-features = false, features = ["ring", "aws_lc_rs", "crypto", "pem", "x509-parser"] }
rsa = { version = "0.9", features = ["pem", "sha2"] }
ryu = "1"
xxhash-rust = { version = "0.8", features = ["xxh64"] }
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt", "io"] }
time = { version = "0.3", features = ["formatting", "parsing", "serde-human-readable"] }
url = "2"
base64 = "0.22"
http = "1"
h2 = "=0.4.20"
h3 = "=0.0.8"
h3-quinn = "=0.0.10"
quinn = { version = "=0.11.12", default-features = false, features = ["runtime-tokio", "rustls-ring"] }
bytes = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["client", "server", "http1", "http2"] }
hyper-util = { version = "0.1", features = ["client-legacy", "http1", "http2", "server", "server-auto", "server-graceful", "tokio"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
hyper-rustls = { version = "0.27", default-features = false, features = ["ring", "http1", "http2", "native-tokio", "tls12"] }
regex = "1"
regex-automata = { version = "=0.4.18", default-features = false, features = ["std", "syntax", "meta", "nfa-pikevm", "hybrid", "dfa-onepass", "unicode"] }
regex-syntax = { version = "=0.8.11", default-features = false, features = ["std", "unicode"] }
bcrypt = "0.17"
arc-swap = "1"
ipnet = "2"
percent-encoding = "2"
mime_guess = "2"
socket2 = { version = "0.6", features = ["all"] }
httpdate = "1"
futures-util = "0.3"
backtrace = "=0.3.76"
flate2 = "=1.1.11"
zstd = "=0.14.3"
tempfile = "=3.27.0"
sfv = { version = "=0.16.1", default-features = false }
tower-service = "0.3"
idna = "1"
async-compression = { version = "0.4", features = ["tokio", "gzip", "zstd"] }
rustls-native-certs = "0.8"
libc = "0.2"
hostname = "0.4"
chrono = { version = "0.4", features = ["clock"] }

reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream", "http2"] }
webpki = { package = "rustls-webpki", version = "0.103", features = ["ring", "std", "aws-lc-rs"] }

p256 = { version = "0.13", features = ["ecdsa", "pkcs8", "pem"] }
p384 = { version = "0.13", features = ["ecdsa", "pkcs8", "pem"] }
ed25519-dalek = { version = "2", features = ["pkcs8", "pem", "rand_core"] }
hmac = "0.12"

aws-lc-rs="1.19.0"
x509-ocsp={version="0.2.1",features=["std"]}
x509-cert="0.2"
der={version="0.7",features=["alloc","derive","oid"]}
sha1={version="0.10",features=["oid"]}
p224={version="0.13.2",features=["ecdsa"]}

openssl = { version = "=0.10.82", features = ["vendored"] }

[patch.crates-io]
http = { path = "vendor/http-1.5.0" }
reqwest = { path = "vendor/reqwest-0.12.28" }
quinn = { path = "vendor/quinn-0.11.12" }
quinn-proto = { path = "vendor/quinn-proto-0.11.19" }
serde_json = { path = "vendor/serde_json-1.0.154" }
hyper = {path="vendor/hyper-1.12.0"}
hyper-util = {path="vendor/hyper-util-0.1.21"}

rustls = { path = "vendor/rustls-0.23.46" }
openssl-sys = { path = "vendor/openssl-sys-0.9.118" }

[target.'cfg(target_os = "linux")'.dependencies]
linux-raw-sys = { version = "0.12", default-features = false, features = ["std", "general"] }

[profile.release]
debug = 1

[profile.release.package."*"]
debug = 0
