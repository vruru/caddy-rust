[package]
name = "caddy-compat-native"
version = "0.1.0"
edition = "2024"
rust-version = "1.99.1"
publish = false
license = "Apache-2.0"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip", "unbounded_depth"] }
sha2 = "0.10"
rustls = { version = "0.23", default-features = false, features = ["ring", "aws_lc_rs", "std", "tls12"] }
rustls-pemfile = "2"
x509-parser = "0.18"
zeroize = "1"
pem = "3"
rustix = { version = "1", features = ["fs", "process"] }
rcgen = { version = "0.14", default-features = false, features = ["ring", "crypto"] }
rsa = { version = "0.9", features = ["pem"] }
ryu = "1"
xxhash-rust = { version = "0.8", features = ["xxh64"] }
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt"] }
time = { version = "0.3", features = ["formatting", "parsing", "serde-human-readable"] }
url = "2"
